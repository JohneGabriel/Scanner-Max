name: Publicar versão

# Manda a versão atual para os clientes: o APK vai para o site e o versao.json avisa os apps.
on:
  workflow_dispatch:
    inputs:
      notas:
        description: "O que mudou (aparece no aviso de atualização)"
        required: false
        default: "Melhorias e correções."

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SMX_KEYSTORE_PASS: ${{ secrets.SMX_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v5
      - name: Conferir segredos
        env:
          KS: ${{ secrets.SMX_KEYSTORE_B64 }}
          AUT: ${{ secrets.SMX_AUTOMACOES }}
        run: |
          [ -n "$KS" ] && [ -n "$SMX_KEYSTORE_PASS" ] && [ -n "$AUT" ] || {
            echo "::error::Faltam segredos (SMX_KEYSTORE_B64, SMX_KEYSTORE_PASS, SMX_AUTOMACOES). Veja servidor/LEIA-ME.md"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SMX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Testes e APK
        run: gradle testReleaseUnitTest assembleRelease --no-daemon -q
      - name: Versão
        id: v
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk ScannerMax.apk
      - name: APK no site
        env:
          GH_TOKEN: ${{ secrets.SMX_AUTOMACOES }}
          REPO: ${{ github.repository_owner }}/scannermax
        run: |
          gh release view app -R "$REPO" >/dev/null 2>&1 || gh release create app -R "$REPO" --title "Scanner Max" --notes "Versão mais recente do app."
          gh release upload app ScannerMax.apk --clobber -R "$REPO"
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/scannermax
          token: ${{ secrets.SMX_AUTOMACOES }}
          path: site
      - name: Avisar os apps (versao.json)
        env:
          NOTAS: ${{ inputs.notas }}
          CODE: ${{ steps.v.outputs.code }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          cd site
          python3 - <<'PY'
          import json, os
          json.dump({"code": int(os.environ["CODE"]), "nome": os.environ["NAME"], "notas": os.environ["NOTAS"],
                     "url": "https://github.com/" + os.environ["GITHUB_REPOSITORY_OWNER"] + "/scannermax/releases/download/app/ScannerMax.apk"},
                    open("versao.json", "w"), ensure_ascii=False, indent=2)
          PY
          git config user.name "scanner-max"; git config user.email "scanner-max@users.noreply.github.com"
          git add versao.json && git commit -qm "versão $NAME" && git push -q || echo "versao.json já estava atualizado"
          echo "### Versão $NAME ($CODE) publicada" >> "$GITHUB_STEP_SUMMARY"
