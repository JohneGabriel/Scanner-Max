name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk obd-elm327.apk

      # artefato da execução (vem dentro de um .zip)
      - uses: actions/upload-artifact@v4
        with:
          name: obd-elm327-apk
          path: obd-elm327.apk

      # release "latest": link direto para baixar o .apk no celular
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última build
          prerelease: true
          files: obd-elm327.apk
