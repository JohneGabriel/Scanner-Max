name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SMX_KEYSTORE_PASS: ${{ secrets.SMX_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v5

      - name: Chave de assinatura definitiva
        env:
          KS: ${{ secrets.SMX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SMX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave definitiva"
          else
            echo "::warning::SMX_KEYSTORE_B64 não configurado: usando a chave de testes"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Testes de unidade
        run: |
          set -o pipefail
          gradle testReleaseUnitTest --no-daemon 2>&1 | tee test.log

      - name: Anotar testes que falharam
        if: failure()
        run: |
          grep -E "FAILED|AssertionError|expected|Exception|^e: " test.log | head -30 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      # em caso de erro, publica as linhas de erro como anotações (legíveis pela API)
      - name: Anotar erros
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do
            echo "::error::$l"
          done
          grep -E "^e: " build.log > errors.txt || true

      # log completo da compilação como artefato (para ler todos os erros pela API)
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-log
          path: |
            build.log
            errors.txt

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk obd-elm327.apk

      # artefato da execução (vem dentro de um .zip)
      - uses: actions/upload-artifact@v5
        with:
          name: obd-elm327-apk
          path: obd-elm327.apk

      # release "latest": link direto para baixar o .apk no celular
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última build
          prerelease: true
          files: obd-elm327.apk
