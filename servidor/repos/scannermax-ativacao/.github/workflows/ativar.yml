name: Ativação

# O app envia "ativar" ou "liberar" (repository_dispatch). A resposta assinada vai para l/<nome>.txt.
on:
  repository_dispatch:
    types: [ativar, liberar]

# um pedido por vez: o registro de aparelhos nunca é escrito por dois ao mesmo tempo
concurrency:
  group: registro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ativar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: ativacao
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/scannermax-licencas
          token: ${{ secrets.SMX_AUTOMACOES }}
          path: licencas
      - name: Processar pedido
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
        run: |
          pip install -q cryptography
          python3 licencas/ferramentas/registro.py ativar licencas ativacao/l
      - name: Salvar
        run: |
          for repo in licencas ativacao; do
            cd "$GITHUB_WORKSPACE/$repo"
            git config user.name "scanner-max"; git config user.email "scanner-max@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && continue
            git commit -qm "pedido"
            for i in 1 2 3 4 5; do git push -q && break; git pull -q --rebase; done
          done
