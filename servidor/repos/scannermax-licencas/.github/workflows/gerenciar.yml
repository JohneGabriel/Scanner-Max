name: Gerenciar venda

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: ["liberar aparelhos", "reenviar mensagem", "bloquear", "desbloquear"]
      pedido:
        description: "Final do pedido (4+ dígitos) ou início do código da licença"
        required: true

concurrency:
  group: registro-vendas
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  gerenciar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Aplicar
        id: g
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
          ACAO: ${{ inputs.acao }}
          PEDIDO: ${{ inputs.pedido }}
        run: |
          pip install -q cryptography
          python3 ferramentas/registro.py gerenciar . 
      - name: Salvar
        run: |
          git config user.name "scanner-max"; git config user.email "scanner-max@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "gerenciar: ${{ inputs.acao }}"
          for i in 1 2 3 4 5; do git push -q && break; git pull -q --rebase; done
      - name: Resultado
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.g.outputs.titulo }}
          MENSAGEM: ${{ steps.g.outputs.mensagem }}
        run: |
          printf '%s\n' "$MENSAGEM" > msg.txt
          url=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$TITULO" --body-file msg.txt)
          echo "### Feito: $url" >> "$GITHUB_STEP_SUMMARY"
