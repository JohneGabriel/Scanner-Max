name: Nova venda

on:
  workflow_dispatch:
    inputs:
      pedido:
        description: "Número do pedido no Mercado Livre (opcional)"
        required: false
        default: ""
      aparelhos:
        description: "Quantos aparelhos a licença aceita"
        required: false
        default: "3"

concurrency:
  group: registro-vendas
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  venda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Gerar licença
        id: lic
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
          PEDIDO: ${{ inputs.pedido }}
          APARELHOS: ${{ inputs.aparelhos }}
        run: |
          pip install -q cryptography
          python3 ferramentas/registro.py venda .
      - name: Salvar no registro
        run: |
          git config user.name "scanner-max"; git config user.email "scanner-max@users.noreply.github.com"
          git add -A && git commit -qm "nova venda"
          for i in 1 2 3 4 5; do git push -q && break; git pull -q --rebase; done
      # a mensagem pronta vira uma issue: fácil de abrir e copiar pelo app do GitHub no celular
      - name: Mensagem para o cliente
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.lic.outputs.titulo }}
          MENSAGEM: ${{ steps.lic.outputs.mensagem }}
        run: |
          gh label create venda --color 2E9E4F --force -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          printf '%s\n' "$MENSAGEM" > msg.txt
          url=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$TITULO" --body-file msg.txt --label venda)
          echo "### Pronto! Abra a mensagem: $url" >> "$GITHUB_STEP_SUMMARY"
